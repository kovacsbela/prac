<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kvíz 🎈</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(160deg, #7c3aed 0%, #4f46e5 45%, #0ea5e9 100%);
        min-height: 100vh;
        color: #1e1b34;
        display: flex;
        justify-content: center;
        padding: 16px;
      }
      #app { width: 100%; max-width: 520px; }
      .card {
        background: #ffffff;
        border-radius: 22px;
        padding: 22px 18px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.25);
        margin-bottom: 14px;
      }
      h1 { font-size: 26px; text-align: center; line-height: 1.25; }
      .sub { text-align: center; color: #6b7280; margin-top: 6px; font-size: 15px; }
      .center { text-align: center; }
      .notice {
        background: #fff7ed; border: 1px solid #fdba74; color: #9a3412;
        border-radius: 14px; padding: 12px; font-size: 14px; line-height: 1.5;
        margin-bottom: 14px;
      }
      .cups { text-align: center; font-size: 34px; letter-spacing: 6px; margin: 10px 0; }
      .cups.small { font-size: 20px; letter-spacing: 3px; margin: 0; }
      .cup.off { filter: grayscale(1); opacity: 0.28; }
      .cup.on { animation: pop 0.5s ease; }
      @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.4); } 100% { transform: scale(1); } }
      .progress-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .progress-num { font-weight: 700; white-space: nowrap; font-size: 14px; color: #4f46e5; }
      .bar { flex: 1; height: 10px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
      .bar-fill { height: 100%; background: linear-gradient(90deg, #7c3aed, #0ea5e9); width: 0%; transition: width 0.3s ease; }
      .level-name { font-weight: 800; color: #7c3aed; font-size: 15px; margin-bottom: 6px; }
      .q-prompt { font-size: 19px; font-weight: 700; line-height: 1.4; margin-bottom: 16px; }
      .q-prompt b { color: #4f46e5; }
      .options { display: grid; gap: 10px; }
      button {
        font-family: inherit;
        font-size: 17px;
        border: none;
        border-radius: 14px;
        padding: 15px 16px;
        cursor: pointer;
        transition: transform 0.06s ease;
      }
      button:active { transform: scale(0.97); }
      .opt { background: #eef2ff; color: #1e1b34; font-weight: 600; text-align: left; min-height: 54px; }
      .opt.correct { background: #16a34a; color: #fff; }
      .opt.wrong { background: #ef4444; color: #fff; }
      .opt:disabled { cursor: default; opacity: 0.95; }
      .btn-main {
        width: 100%;
        background: linear-gradient(90deg, #7c3aed, #4f46e5);
        color: #fff;
        font-weight: 800;
        font-size: 18px;
        min-height: 56px;
        margin-top: 8px;
      }
      .btn-secondary {
        width: 100%;
        background: #f1f5f9;
        color: #4f46e5;
        font-weight: 700;
        font-size: 16px;
        min-height: 50px;
        margin-top: 8px;
      }
      .feedback { margin-top: 14px; }
      .fb-title { font-weight: 800; font-size: 17px; margin-bottom: 8px; }
      .fb-good { color: #15803d; }
      .fb-bad { color: #dc2626; }
      .explain {
        background: #fefce8;
        border: 1px solid #fde68a;
        border-radius: 14px;
        padding: 14px;
        font-size: 15.5px;
        line-height: 1.55;
      }
      .rules { display: grid; gap: 10px; margin: 16px 0 4px; }
      .rule {
        display: flex; gap: 10px; align-items: flex-start;
        background: #f8fafc; border: 1px solid #e2e8f0;
        border-radius: 14px; padding: 12px; font-size: 15px; line-height: 1.45;
      }
      .rule .ico { font-size: 20px; }
      .rule b { color: #4f46e5; }
      .level-list { display: grid; gap: 8px; margin-top: 14px; }
      .level-row {
        display: flex; align-items: center; gap: 10px;
        background: #f8fafc; border: 1px solid #e2e8f0;
        border-radius: 12px; padding: 10px 12px; font-size: 15px;
      }
      .level-row .name { font-weight: 700; flex: 1; }
      .level-row .pts { color: #6b7280; font-size: 13px; font-weight: 700; }
      .level-row.nocup { opacity: 0.75; }
      .mistake { border-left: 4px solid #f59e0b; background: #fffbeb; border-radius: 10px; padding: 12px; margin-top: 10px; }
      .mistake .m-title { font-weight: 700; font-size: 15px; }
      .mistake .m-exp { font-size: 14px; color: #57534e; line-height: 1.5; margin-top: 4px; }
      .big-emoji { font-size: 54px; text-align: center; }
      .final-title { font-size: 24px; font-weight: 800; text-align: center; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div id="app"><div class="card center"><p class="sub">⏳ Betöltés…</p></div></div>
    <script>
      const app = document.getElementById("app");

      /* Tartalom betöltése: quizzes.json a szerverről (GitHub Pages).
         Ha nem sikerül (pl. homokozat-előnézet), egy kis minta kvíz jelenik meg. */
      const DEMO_QUIZ = {
        id: "demo",
        ico: "🧪",
        name: "Minta kvíz",
        desc: "Így működik a motor!",
        tag: "Előnézet",
        cupMin: 1,
        rules: [
          { ico: "🔧", text: "<b>Képző</b> – új szót alkot: kert → kert<b>ész</b>" },
          { ico: "🏷️", text: "<b>Jel</b> – nem új szó, csak jelez: kert<b>ek</b>" },
          { ico: "🔗", text: "<b>Rag</b> – a mondatban köti össze a szavakat: kert<b>ben</b>" }
        ],
        levels: [
          {
            name: "1. szint – Minta 🌱",
            questions: [
              {
                title: "kertben → rag",
                prompt: "Milyen toldalék van a <b>kertben</b> szóban?",
                options: [{ text: "Képző" }, { text: "Jel" }, { text: "Rag", ok: true }],
                explain: "A -ben rag: a mondatban köti össze a szavakat (hol?)."
              },
              {
                title: "kertek → jel",
                prompt: "Milyen toldalék van a <b>kertek</b> szóban?",
                options: [{ text: "Képző" }, { text: "Jel", ok: true }, { text: "Rag" }],
                explain: "Az -ek a többes szám jele: nem új szó, csak jelez."
              }
            ]
          },
          {
            name: "2. szint – Minta 🎓",
            questions: [
              {
                title: "kertész → képző",
                prompt: "Milyen toldalék van a <b>kertész</b> szóban?",
                options: [{ text: "Képző", ok: true }, { text: "Jel" }, { text: "Rag" }],
                explain: "A kertből új szó lett: kertész. Új szót alkotó toldalék = képző."
              },
              {
                title: "hazám → jel",
                prompt: "Milyen toldalék van a <b>hazám</b> szóban?",
                options: [{ text: "Képző" }, { text: "Jel", ok: true }, { text: "Rag" }],
                explain: "A -m birtokos jel: azt jelzi, kié a ház. Ezért jel."
              }
            ]
          }
        ]
      };

      let QUIZ = null;
      let LEVELS = [];
      let CUP_MIN = 3;
      let STORE_KEY = "";
      let demoMode = false;

      let mode = "full";
      let currentLevel = 0;
      let qi = 0;
      let levelScore = 0;
      let levelMistakes = [];
      let cups = [];
      let best = [];
      let shuffled = [];

      function loadState() {
        try {
          const raw = window.localStorage.getItem(STORE_KEY);
          if (!raw) return null;
          const s = JSON.parse(raw);
          if (!s || !Array.isArray(s.cups) || !Array.isArray(s.best) || s.cups.length !== LEVELS.length || s.best.length !== LEVELS.length) return null;
          return s;
        } catch (e) {
          return null;
        }
      }
      function saveState() {
        try {
          window.localStorage.setItem(STORE_KEY, JSON.stringify({ cups: cups, best: best }));
        } catch (e) {}
      }
      function clearState() {
        try {
          window.localStorage.removeItem(STORE_KEY);
        } catch (e) {}
      }

      function initQuiz(q) {
        QUIZ = q;
        LEVELS = q.levels;
        CUP_MIN = q.cupMin || 3;
        STORE_KEY = "kviz-" + q.id;
        cups = LEVELS.map(() => false);
        best = LEVELS.map(() => 0);
        shuffled = LEVELS.map(l =>
          l.questions.map(item => ({
            ...item,
            options: item.options
              .map(o => ({ text: o.text, ok: !!o.ok, r: Math.random() }))
              .sort((a, b) => a.r - b.r)
          }))
        );
        const s = loadState();
        if (s) {
          cups = s.cups.map(Boolean);
          best = s.best.map(n => Number(n) || 0);
        }
      }

      function cupsRow(n, small) {
        let s = "";
        for (let i = 0; i < LEVELS.length; i++) {
          s += `<span class="cup ${i < n ? "on" : "off"}">🏆</span>`;
        }
        return `<div class="cups ${small ? "small" : ""}">${s}</div>`;
      }

      function showStart() {
        const cupCount = cups.filter(Boolean).length;
        const hasProgress = cupCount > 0;
        let startBtns;
        if (cupCount === LEVELS.length) {
          startBtns = `
            <button class="btn-main" onclick="showEnd()">Eredmények megtekintése 🏁</button>
            <button class="btn-secondary" onclick="startGame(true)">Új játék 🔄</button>`;
        } else if (hasProgress) {
          startBtns = `
            <button class="btn-main" onclick="resume()">Folytatás ▶️</button>
            <button class="btn-secondary" onclick="startGame(true)">Új játék az elejétől 🔄</button>`;
        } else {
          startBtns = `<button class="btn-main" onclick="startGame(true)">Mehet! 🚀</button>`;
        }
        const rulesHtml = (QUIZ.rules || [])
          .map(r => `<div class="rule"><span class="ico">${r.ico || "💡"}</span><div>${r.text}</div></div>`)
          .join("");
        app.innerHTML = `
          ${demoMode ? `<div class="notice">🧪 <b>Előnézeti minta.</b> A valódi kvízek a <b>quizzes.json</b> fájlból töltődnek be, ha az oldalt szerverről nyitod meg (GitHub Pages).</div>` : ""}
          <div class="card">
            <h1>${QUIZ.ico || "🎯"} ${QUIZ.name}</h1>
            <p class="sub">${QUIZ.desc || ""}</p>
            ${cupsRow(cupCount)}
          </div>
          ${rulesHtml ? `<div class="card">${rulesHtml}</div>` : ""}
          <div class="card">
            <p class="center" style="font-size:15px; line-height:1.5;">
              <b>${LEVELS.length} szint</b> vár.<br>
              Ha egy szinten legalább <b>${CUP_MIN} helyes</b> válaszod van, <b>kupát</b> kapsz! 🏆<br>
              Gyűjtsd össze mind a <b>${LEVELS.length} kupát</b> – akkor jön a nagy ünneplés! 🎊
              <br><br><span style="color:#94a3b8;font-size:13px;">💾 Előrehaladásod elmentjük a böngészőben, így legközelebb onnan folytathatod, ahol abbahagytad.</span>
            </p>
          </div>
          ${startBtns}
        `;
      }

      function startGame(fullRestart) {
        if (fullRestart) {
          mode = "full";
          cups = LEVELS.map(() => false);
          best = LEVELS.map(() => 0);
          clearState();
        }
        if (mode === "missing") {
          const first = cups.findIndex(c => !c);
          if (first !== -1) startLevel(first);
          else showEnd();
        } else {
          startLevel(0);
        }
      }

      function resume() {
        const first = cups.findIndex(c => !c);
        if (first !== -1) startLevel(first);
        else showEnd();
      }

      function startLevel(i) {
        currentLevel = i;
        qi = 0;
        levelScore = 0;
        levelMistakes = [];
        showQuestion();
      }

      function showQuestion() {
        const level = LEVELS[currentLevel];
        const q = shuffled[currentLevel][qi];
        const opts = q.options
          .map((o, i) => `<button class="opt" id="opt-${i}" onclick="answer(${i})">${o.text}</button>`)
          .join("");
        const cupsNow = cups.filter(Boolean).length;
        app.innerHTML = `
          <div class="progress-wrap">
            <span class="progress-num">${qi + 1}/${level.questions.length}</span>
            <div class="bar"><div class="bar-fill" style="width:${(qi / level.questions.length) * 100}%"></div></div>
            <span class="progress-num">⭐ ${levelScore}</span>
          </div>
          <div class="progress-wrap">
            <div class="level-name">${level.name}</div>
          </div>
          <div class="card">
            <div class="q-prompt">${q.prompt}</div>
            <div class="options">${opts}</div>
            <div id="feedback" class="feedback"></div>
          </div>
          <div class="progress-wrap" style="justify-content:center;">
            ${cupsRow(cupsNow, true)}
          </div>
        `;
        window.scrollTo(0, 0);
      }

      function answer(i) {
        const q = shuffled[currentLevel][qi];
        const chosen = q.options[i];
        const correctIdx = q.options.findIndex(o => o.ok);
        q.options.forEach((o, idx) => {
          const btn = document.getElementById("opt-" + idx);
          btn.disabled = true;
          if (o.ok) btn.classList.add("correct");
        });
        if (chosen.ok) {
          levelScore++;
        } else {
          document.getElementById("opt-" + i).classList.add("wrong");
          levelMistakes.push({ title: q.title, explain: q.explain });
        }
        const last = qi === LEVELS[currentLevel].questions.length - 1;
        document.getElementById("feedback").innerHTML = `
          <div class="fb-title ${chosen.ok ? "fb-good" : "fb-bad"}">
            ${chosen.ok ? "Helyes! 🎉" : "Helytelen 😅 A jó válasz: " + q.options[correctIdx].text}
          </div>
          <div class="explain">💡 ${q.explain}</div>
          <button class="btn-main" onclick="next()">${last ? "Szint vége 🏁" : "Következő ➡️"}</button>
        `;
      }

      function next() {
        qi++;
        if (qi < LEVELS[currentLevel].questions.length) showQuestion();
        else showLevelResult();
      }

      function showLevelResult() {
        const lvl = currentLevel;
        const total = LEVELS[lvl].questions.length;
        const passed = levelScore >= CUP_MIN;
        const earned = passed && !cups[lvl];
        if (passed) cups[lvl] = true;
        if (levelScore > best[lvl]) best[lvl] = levelScore;
        saveState();
        const cupsNow = cups.filter(Boolean).length;
        const mistakesHtml = levelMistakes.length
          ? `<h3 class="center" style="margin-top:16px;">Átnézendő kérdések 📝</h3>` +
            levelMistakes
              .map(m => `<div class="mistake"><div class="m-title">${m.title}</div><div class="m-exp">${m.explain}</div></div>`)
              .join("")
          : `<p class="center" style="margin-top:14px;color:#16a34a;font-weight:700;">Egy hiba sincs ezen a szinten! 🎊</p>`;
        const last = lvl === LEVELS.length - 1;
        let btns = "";
        if (last || mode === "missing") {
          btns = `<button class="btn-main" onclick="showEnd()">Eredmény 🏁</button>`;
          if (!passed) {
            btns = `<button class="btn-main" onclick="startLevel(${lvl})">Szint újrapróbálása 🔁</button>` + btns;
          }
        } else {
          btns = `<button class="btn-main" onclick="startLevel(${lvl + 1})">Következő szint ➡️</button>`;
          if (!passed) {
            btns = `<button class="btn-secondary" onclick="startLevel(${lvl})">Szint újrapróbálása 🔁</button>` + btns;
          }
        }
        app.innerHTML = `
          <div class="card center">
            <div class="big-emoji">${passed ? "🏆" : "💪"}</div>
            <h2 style="font-size:21px;">${passed ? "Kupa megszerezve!" : "Sajnos nem sikerült…"}</h2>
            <p class="sub">${levelScore}/${total} helyes válasz ${passed ? "– ezért jár a kupa!" : "– a kupához legalább " + CUP_MIN + " helyes válasz kell."}</p>
            ${cupsRow(cupsNow)}
            ${mistakesHtml}
            <p style="margin-top:12px;font-size:13px;color:#94a3b8;">💾 Az előrehaladás elmentve a böngészőben</p>
          </div>
          ${btns}
        `;
        if (earned) launchConfetti(70, 1, 2600);
        window.scrollTo(0, 0);
      }

      function showEnd() {
        const cupCount = cups.filter(Boolean).length;
        const totalBest = best.reduce((a, b) => a + b, 0);
        const grandTotal = LEVELS.reduce((a, l) => a + l.questions.length, 0);
        const allCups = cupCount === LEVELS.length;
        let emoji, msg;
        if (allCups) {
          emoji = "🏆";
          msg = "MINDEN KUPA MEGVAN! Toldalék-mester vagy!";
        } else if (cupCount >= Math.ceil(LEVELS.length / 2)) {
          emoji = "💪";
          msg = "Nagyon szuper! Már csak " + (LEVELS.length - cupCount) + " kupa hiányzik.";
        } else {
          emoji = "🌱";
          msg = "Ne add fel! Nézd meg a magyarázatokat, és próbáld újra!";
        }
        const levelList = LEVELS
          .map((l, i) => `
            <div class="level-row ${cups[i] ? "" : "nocup"}">
              <span>${cups[i] ? "🏆" : "⚪"}</span>
              <span class="name">${l.name}</span>
              <span class="pts">${best[i]}/${l.questions.length}</span>
            </div>
          `)
          .join("");
        let btns = "";
        if (!allCups) {
          btns += `<button class="btn-main" onclick="retryMissing()">Hiányzó kupák megszerzése 🔁</button>`;
        }
        btns += `<button class="btn-secondary" onclick="startGame(true)">Újra az elejétől 🔄</button>`;
        btns += `<button class="btn-secondary" onclick="goHome()">⬅️ Vissza a kezdőlapra</button>`;
        app.innerHTML = `
          <div class="card center">
            <div class="big-emoji">${emoji}</div>
            <div class="final-title">${allCups ? "🎊 GRATULÁLOK! 🎊" : "Vége a túrának!"}</div>
            ${cupsRow(cupCount)}
            <p class="sub">${msg}</p>
            <p style="margin-top:8px;font-weight:700;color:#4f46e5;">Összpontszám: ${totalBest}/${grandTotal}</p>
            <div class="level-list">${levelList}</div>
          </div>
          ${btns}
        `;
        if (allCups) launchConfetti(130, 4, 9000);
        window.scrollTo(0, 0);
      }

      function retryMissing() {
        mode = "missing";
        const first = cups.findIndex(c => !c);
        if (first !== -1) startLevel(first);
        else showEnd();
      }

      function goHome() {
        window.location.href = "index.html";
      }

      function launchConfetti(n, waves, duration) {
        const c = document.createElement("canvas");
        c.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99;";
        document.body.appendChild(c);
        const ctx = c.getContext("2d");
        function fit() { c.width = window.innerWidth; c.height = window.innerHeight; }
        fit();
        window.addEventListener("resize", fit);
        const colors = ["#f43f5e", "#f59e0b", "#22c55e", "#3b82f6", "#a855f7", "#ec4899", "#eab308"];
        const parts = [];
        function spawn(x) {
          parts.push({
            x: x !== undefined ? x : Math.random() * c.width,
            y: -20 - Math.random() * 80,
            vx: (Math.random() - 0.5) * 2.5,
            vy: 1.5 + Math.random() * 2.5,
            r: Math.random() * Math.PI,
            vr: (Math.random() - 0.5) * 0.25,
            c: colors[Math.floor(Math.random() * colors.length)],
            w: 8 + Math.random() * 6,
            h: 5 + Math.random() * 5
          });
        }
        for (let i = 0; i < n; i++) spawn();
        for (let w = 1; w <= waves; w++) {
          setTimeout(() => {
            for (let i = 0; i < n; i++) spawn((c.width * w) / (waves + 1) + (Math.random() - 0.5) * 90);
          }, w * 900);
        }
        const start = performance.now();
        (function tick() {
          ctx.clearRect(0, 0, c.width, c.height);
          parts.forEach(p => {
            p.x += p.vx; p.y += p.vy; p.vy += 0.015; p.r += p.vr;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.r);
            ctx.fillStyle = p.c;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          });
          const t = performance.now() - start;
          if (t < duration && parts.some(p => p.y < c.height + 40)) {
            requestAnimationFrame(tick);
          } else {
            window.removeEventListener("resize", fit);
            c.remove();
          }
        })();
      }

      function showError() {
        app.innerHTML = `
          <div class="card center">
            <div class="big-emoji">😕</div>
            <h1>Ilyen kvíz nem található</h1>
            <p class="sub">Ellenőrizd, hogy jó linket kaptál-e.</p>
            <button class="btn-main" onclick="goHome()">Vissza a kezdőlapra ⬅️</button>
          </div>
        `;
      }

      async function main() {
        const wantedId = new URLSearchParams(window.location.search).get("id");
        let content = null;
        try {
          const res = await fetch("quizzes.json", { cache: "no-cache" });
          if (res.ok) content = await res.json();
        } catch (e) {}
        if (content && Array.isArray(content.quizzes)) {
          const q = content.quizzes.find(x => x.id === wantedId);
          if (!q) { showError(); return; }
          initQuiz(q);
        } else {
          demoMode = true;
          initQuiz(DEMO_QUIZ);
        }
        document.title = (QUIZ.ico || "🎯") + " " + QUIZ.name;
        showStart();
      }

      main();
    </script>
  </body>
</html>
